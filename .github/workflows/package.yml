name: Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/package.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Build the Windows download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The bundle must contain uv's relocatable standalone CPython, not the runner's Python.
      - run: uv sync --locked --python-preference only-managed
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm run package
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MemoryMonitor-win32-x64
          path: |
            desktop/out/MemoryMonitor-*-win32-x64.zip
            desktop/out/MemoryMonitor-*-win32-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MemoryMonitor-win32-x64
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MemoryMonitor-*-win32-x64.zip* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
